name: Submit Mod Entry
description: Submit or update a mod or modpack in the catalog.
title: "[Submission]: "
labels: ["catalog-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing to the LumInstaller catalog! A bot turns this
        issue into a pull request automatically. Please fill fields accurately —
        the PR will flag anything that looks off (non-HTTPS URL, bad checksum,
        missing Minecraft version, etc.), but getting it right here saves a round trip.

  - type: input
    id: id
    attributes:
      label: Mod ID
      description: "Unique, lowercase, kebab-case (letters, numbers, hyphens only). Example: `rlcraft`."
      placeholder: "rlcraft"
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Display Name
      description: Human-friendly name shown in the app.
      placeholder: "RLCraft"
    validations:
      required: true

  - type: input
    id: game
    attributes:
      label: Game
      description: The game this entry belongs to. Use "Minecraft" for Minecraft modpacks.
      placeholder: "Minecraft"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: One or two sentences describing the mod/modpack.
      placeholder: "A hardcore fantasy-RPG survival modpack..."
    validations:
      required: true

  - type: input
    id: filename
    attributes:
      label: Filename
      description: The exact filename to save the download as (including the extension).
      placeholder: "RLCraft Server Pack 1.12.2 - Release v2.9.3.zip"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Download URL
      description: "Direct download link. **Must be HTTPS** — the app refuses non-HTTPS downloads."
      placeholder: "https://mediafilez.forgecdn.net/files/..."
    validations:
      required: true

  - type: input
    id: size
    attributes:
      label: File Size (Bytes)
      description: "Exact size in bytes. PowerShell: `(Get-Item file.zip).Length`. Leave blank if unknown."
      placeholder: "334397653"

  - type: input
    id: version
    attributes:
      label: Mod Version
      description: Version string of the mod/modpack.
      placeholder: "2.9.3"

  - type: input
    id: sha256
    attributes:
      label: SHA-256 Checksum
      description: "64 hex characters of the exact file. PowerShell: `(Get-FileHash file.zip -Algorithm SHA256).Hash.ToLower()`."
      placeholder: "a29b3c0c99b41e1c7d404a78f48b7f9698f15b068141a042d5ca1108a8636c55"

  - type: markdown
    attributes:
      value: |
        ### Minecraft modpacks only
        The next fields are **only needed for Minecraft `.zip` modpacks**.
        Filling them in makes the app install the pack as a proper PrismLauncher
        instance (pinning Minecraft + the mod loader). Leave them blank for
        non-Minecraft entries or plain downloads.

        Pick the **Mod Loader**, then fill in the version for that loader only
        (Forge Version **or** Fabric Loader Version).

  - type: input
    id: minecraft
    attributes:
      label: Minecraft Version
      description: Target Minecraft version. Required for modpacks to install as an instance.
      placeholder: "1.12.2"

  - type: dropdown
    id: loader
    attributes:
      label: Mod Loader
      description: The mod loader the pack uses. Defaults to Forge if left as the default.
      options:
        - Forge
        - Fabric
      default: 0

  - type: input
    id: forge
    attributes:
      label: Forge Version
      description: Forge version the modpack targets (only if Mod Loader is Forge).
      placeholder: "14.23.5.2860"

  - type: input
    id: fabric
    attributes:
      label: Fabric Loader Version
      description: Fabric loader version the modpack targets (only if Mod Loader is Fabric).
      placeholder: "0.16.9"

  - type: input
    id: instanceName
    attributes:
      label: PrismLauncher Instance Name
      description: Name of the created PrismLauncher instance folder (defaults to the display name if blank).
      placeholder: "RLCraft"
