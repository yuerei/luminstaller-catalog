name: Submit Catalog Entry
description: Submit a new entry to be added to the catalog.
title: "[Submission]: "
labels: ["catalog-submission"]
body:
  - type: input
    id: item_id
    attributes:
      label: Item ID
      description: Unique alphanumeric key for this entry (e.g., `my-cool-mod`).
      placeholder: "my-cool-mod"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Display Name
      placeholder: "My Cool Mod"
    validations:
      required: true
  - type: input
    id: download_url
    attributes:
      label: Download URL
      placeholder: "https://example.com/download.zip"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: "Short summary of what this item provides."
