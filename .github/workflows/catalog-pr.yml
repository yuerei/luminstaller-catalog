name: Create Catalog PR from Issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create_catalog_pr:
    # Only run if the issue has the 'catalog-submission' label
    if: contains(github.event.issue.labels.*.name, 'catalog-submission')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Issue and Update JSON
        id: update-json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueBody = context.payload.issue.body;

            // Helper to parse GitHub Issue Form fields
            function getFieldValue(label) {
              const regex = new RegExp(`### ${label}\\s*\\n\\s*([\\s\\S]*?)(?=\\n### |$)`);
              const match = issueBody.match(regex);
              return match ? match[1].trim() : '';
            }

            const itemId = getFieldValue('Item ID');
            const name = getFieldValue('Display Name');
            const downloadUrl = getFieldValue('Download URL');
            const description = getFieldValue('Description');

            if (!itemId || !downloadUrl) {
              core.setFailed('Missing required fields in submission.');
              return;
            }

            const catalogPath = './catalog.json';
            let catalog = [];

            if (fs.existsSync(catalogPath)) {
              catalog = JSON.parse(fs.readFileSync(catalogPath, 'utf8'));
            }

            // Check if entry already exists (update or add)
            const existingIndex = catalog.findIndex(item => item.id === itemId);
            const newEntry = { id: itemId, name, download_url: downloadUrl, description };

            if (existingIndex !== -1) {
              catalog[existingIndex] = newEntry;
            } else {
              catalog.push(newEntry);
            }

            fs.writeFileSync(catalogPath, JSON.stringify(catalog, null, 2) + '\n');
            core.setOutput('item_name', name || itemId);
            core.setOutput('item_id', itemId);

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(catalog): add ${{ steps.update-json.outputs.item_name }}"
          title: "Add `${{ steps.update-json.outputs.item_name }}` to catalog"
          body: |
            Automated Pull Request generated from issue #${{ github.event.issue.number }}.

            - **Item ID:** `${{ steps.update-json.outputs.item_id }}`
            - **Item Name:** ${{ steps.update-json.outputs.item_name }}
            - **Closes:** #${{ github.event.issue.number }}
          branch: "submission/issue-${{ github.event.issue.number }}"
          delete-branch: true
          labels: "catalog-submission, automated-pr"

      - name: Comment on Issue with PR Link
        uses: actions/github-script@v7
        with:
          script: |
            const prUrl = "${{ steps.cpr.outputs.pull-request-url }}";
            if (prUrl) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `👋 Thanks for submitting! A pull request has been automatically created for review: ${prUrl}`
              });
            }
